name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_*_env.ini'
      - 'hat_*_env.ini'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_*_env.ini'
      - 'hat_*_env.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        example:
          - PlotToSerial

        unit:
          - UnitCO2
          - UnitCO2L
          - UnitENVIII
          - UnitENVIV
          - UnitENVPro
          - UnitTVOC
          - UnitMiniBPS11

        board:
          # Build-safe minimal set: one board per distinct compile config
          # (toolchain x chip arch x deps). Sibling boards differ only by
          # variant header and are commented out (re-enable to also catch
          # variant-specific build breaks).
          - Core              # espressif32 / ESP32 (bsec2 included)
          # - Core2           # ESP32: represented by Core
          - CoreS3            # espressif32 / ESP32-S3
          # - Fire            # ESP32: represented by Core
          # - StampS3         # ESP32-S3: represented by CoreS3
          # - Dial            # ESP32-S3: represented by CoreS3
          # - Atom            # ESP32: represented by Core
          # - AtomS3          # ESP32-S3: represented by CoreS3
          # - AtomS3R         # ESP32-S3: represented by CoreS3
          - NanoC6            # pioarduino / ESP32-C6 (bsec2 excluded)
          - NanoH2            # pioarduino / ESP32-H2
          # - StickCPlus      # ESP32: represented by Core (Hat built via include)
          # - StickCPlus2     # ESP32: represented by Core
          # - StickS3         # ESP32-S3: represented by CoreS3
          # - Paper           # ESP32: represented by Core (Paper.cpp built via include)
          # - CoreInk         # ESP32: represented by Core
          # - Cardputer       # ESP32-S3: represented by CoreS3
          - Tab5              # pioarduino / ESP32-P4 (16MB part, bsec2 excluded)
          # - NessoN1         # ESP32-C6: represented by NanoC6 (Wire1 built via include)

        framework:
          - Arduino

        espressif32:
          - latest


        include:
          # Specific sketches
          # Paper
          - example: Paper
            unit: BuiltinSHT30
            board: Paper
            framework: Arduino
            espressif32: latest
          # HatENV3 (addHatI2C branch): build on both platforms
          - example: PlotToSerial
            unit: HatENVIII
            board: StickCPlus
            framework: Arduino
            espressif32: latest
          # - example: PlotToSerial      # StickCPlus2: represented by StickCPlus
          #   unit: HatENVIII
          #   board: StickCPlus2
          #   framework: Arduino
          #   espressif32: latest
          # - example: PlotToSerial      # StickS3: represented by StickCPlus
          #   unit: HatENVIII
          #   board: StickS3
          #   framework: Arduino
          #   espressif32: latest
          # - example: PlotToSerial      # CoreInk: represented by StickCPlus
          #   unit: HatENVIII
          #   board: CoreInk
          #   framework: Arduino
          #   espressif32: latest
          - example: PlotToSerial
            unit: HatENVIII
            board: NessoN1
            framework: Arduino
            espressif32: latest
          # HatYun (StickCPlus / StickCPlus2 only)
          - example: HatYunEnvironmentGlow
            unit: HatYun
            board: StickCPlus
            framework: Arduino
            espressif32: latest
          # - example: HatYunEnvironmentGlow   # StickCPlus2: represented by StickCPlus
          #   unit: HatYun
          #   board: StickCPlus2
          #   framework: Arduino
          #   espressif32: latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
