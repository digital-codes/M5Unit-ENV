description: Library for M5Stack UNIT ENV using M5UnitUnified.
url: https://github.com/m5stack/M5Unit-ENV
issues: https://github.com/m5stack/M5Unit-ENV/issues
license: MIT
version: "1.5.0"

dependencies:
  idf: ">=5.0"
  m5stack/M5UnitUnified:
    git: https://github.com/m5stack/M5UnitUnified.git
    version: main
  m5stack/M5Utility:
    git: https://github.com/m5stack/M5Utility.git
    version: main
  # BME688 raw register API (Bosch, BSD-3, all targets). In-repo DL-recipe (no Bosch bytes); fetches
  # the same upstream "BME68x Sensor library" the Arduino build uses. Exposes <bme68x/bme68x.h>.
  bme68x:
    path: components/bme68x
  # BSEC2 DL-recipe lives in this repo (no Bosch bytes). Pulled as a local path dependency so the
  # component manager adds it to the build graph (Kconfig visible in menuconfig). The Bosch prebuilt
  # blob exists only for esp32/s2/s3/c3, so the dependency is gated to those targets -- on c6/h2/p4 it
  # is not a dependency at all (declaring it unconditionally errors there: "does not support target").
  # The DL+link only happens when CONFIG_M5UNIT_ENV_ENABLE_BSEC2=y (see components/bsec2).
  bsec2:
    path: components/bsec2
    rules:
      - if: "target in [esp32, esp32s2, esp32s3, esp32c3]"

targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2
  - esp32p4

files:
  exclude:
    - "docs/**"
    - "examples/**"
    - "test/**"
    - "boards/**"
    - "platformio.ini"
    - "library.json"
    - "library.properties"
    - ".clang-format"
    - ".gitignore"
    - "*_env.ini"
