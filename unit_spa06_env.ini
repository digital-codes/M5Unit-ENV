; For SPA06-003 barometer (on Unit DoF10)

[env:----------------------------------------separator_spa06_0]

; ================================
; UnitSPA06 (SPA06-003)
; ================================
; --------------------------------
; UnitTest
; --------------------------------
; The SPA06-003 barometer has no standalone GROVE product; it ships on Unit DoF10 (U230) at 0x76.
; Plug a DoF10 into the Grove port to run the embedded tests.
; SPA06
; Native (desktop) data test; runs on the host, no hardware required
[env:test_native_SPA06_data]
extends=test_native
test_filter= native/test_spa06_data

[env:test_SPA06_Core]
extends=Core, option_release, arduino_latest
lib_deps = ${Core.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_spa06

